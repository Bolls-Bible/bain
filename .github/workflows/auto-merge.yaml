name: Auto-Merge PR

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'Pull request URL to enable auto-merge for'
        required: false
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable Auto-Merge via GitHub CLI
        run: |
          if [[ -n "$PR_URL" ]]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
          fi
        env:
          PR_URL: ${{ github.event.inputs.pr_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}